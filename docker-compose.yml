services:
  math-toolkit-jala:
    build:
      context: .
      dockerfile: Dockerfile
    image: math-toolkit-jala:latest
    container_name: math-toolkit-jala
    # The image already sets ENTRYPOINT ["math-toolkit-jala"]. Passing arguments via
    # `docker compose run --rm math-toolkit-jala <args>` overrides CMD only, keeping
    # the entrypoint intact.
