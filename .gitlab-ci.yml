# GitLab CI/CD pipeline for math-utils
# Mirrors the GitHub Actions workflow: lint, format, typecheck, and tests.
# Image publishing is handled exclusively by the GitHub Actions workflow.

stages:
  - quality
  - test

variables:
  UV_VERSION: "0.13.0"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"

default:
  image:
    name: ghcr.io/astral-sh/uv:${UV_VERSION}
    entrypoint: [""]
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache/

# -----------------------------------------------------------------------------
# Quality stage: lint, format, typecheck run in parallel
# -----------------------------------------------------------------------------

lint:
  stage: quality
  script:
    - uv sync --frozen
    - uv run ruff check src tests
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

format:
  stage: quality
  script:
    - uv sync --frozen
    - uv run ruff format --check src tests
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

typecheck:
  stage: quality
  script:
    - uv sync --frozen
    - uv run mypy src tests
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# -----------------------------------------------------------------------------
# Test stage: runs only after quality jobs pass
# -----------------------------------------------------------------------------

test:
  stage: test
  script:
    - uv sync --frozen
    - uv run pytest --cov=math_utils --cov-report=term-missing
  coverage: '/TOTAL\s+\d+\s+\d+\s+\d+\s+(\d+)%/'
  artifacts:
    when: always
    paths:
      - htmlcov/
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
